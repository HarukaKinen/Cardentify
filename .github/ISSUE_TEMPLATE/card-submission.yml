name: 提交卡面
description: 提交一张来自支持服务的原始卡面
title: "[卡面提交] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你向 Cardentify 提交卡面。

        请直接上传从支付服务取得的原始文件，不要裁剪、缩放、压缩、转码、移除背景、添加水印或进行其他二次处理。

        > [!WARNING]
        > 请勿上传 `pass.json`、完整卡号、持卡人姓名、有效期、CVV、Token 或其他敏感信息。

  - type: dropdown
    id: source
    attributes:
      label: 卡面来源
      description: 请选择取得该卡面的服务。
      options:
        - Apple Pay
        - Google Pay
        - PayPal
        - Samsung Pay
        - Mi Pay
        - 云闪付
    validations:
      required: true

  - type: textarea
    id: artwork
    attributes:
      label: 卡面文件上传
      description: 请将卡面文件直接拖放到此处。特殊格式无法直接上传时，请将原文件打包为 ZIP 后上传。
      placeholder: 将原始卡面文件拖放到此处……
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 卡面其他信息
      description: 可选。可提供银行或发卡机构、卡片名称、类型、卡组织、等级、发行国家或地区、六位或八位 BIN/IIN、资金结算机构等信息。无法确认的内容请留空，不要猜测，也不要提交完整卡号。
      placeholder: |
        银行或发卡机构：
        卡片名称：
        卡片类型：
        卡组织：
        卡片等级：
        发行国家或地区：
        BIN/IIN（仅前六位或八位）：
        资金结算机构：
        其他说明：

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我确认已上传从所选服务取得的原始卡面文件，未对卡面进行二次处理。
          required: true
        - label: 我确认提交内容中不包含 `pass.json`、完整卡号、CVV、Token 或其他敏感信息。
          required: true
